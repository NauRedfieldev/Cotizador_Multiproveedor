# nginx delante de uvicorn (docs/36). Sirve /static/ y pasa todo lo demás a la app («web»).
server_tokens off;

server {
    listen 80;
    server_name _;

    # Igual al tope de Django (DATA_UPLOAD_MAX_MEMORY_SIZE = 2.5 MB): la app no recibe archivos.
    client_max_body_size 2560k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # DNS interno de Docker: si «web» se vuelve a crear con otra IP, nginx la encuentra sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://web:8000;

    location /static/ {
        alias /srv/static/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        # $http_host conserva el puerto (localhost:8080); con $host Django rechazaría los POST por CSRF.
        proxy_set_header Host $http_host;
        # REEMPLAZA la IP (no la agrega): así nadie puede inventarse otra con este encabezado
        # y saltarse los límites por IP del login (pista 13 de la auditoría).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El comparador espera a los proveedores (Exel hasta 10 s) y un envío de correo hasta 20 s.
        proxy_read_timeout 60s;
    }
}
